<!DOCTYPE html>
<html>
<head>
<title>Simple Website Builder</title>
<style>
body{
font-family:Arial;
background:#1e1e1e;
color:white;
}

#toolbar{
padding:10px;
background:#333;
}

button{
margin:5px;
padding:8px;
}

#canvas{
background:white;
color:black;
min-height:400px;
margin:10px;
padding:10px;
border:2px solid #555;
}

textarea{
width:100%;
height:150px;
}
</style>
</head>

<body>

<div id="toolbar">
<button onclick="addText()">Add Text</button>
<button onclick="addButton()">Add Button</button>
<button onclick="addImage()">Add Image</button>
<button onclick="exportHTML()">Export HTML</button>
</div>

<div id="canvas"></div>

<textarea id="output" placeholder="Generated HTML will appear here"></textarea>

<script>

function addText(){
let text = prompt("Enter text");
if(!text) return;

let el = document.createElement("p");
el.textContent = text;
document.getElementById("canvas").appendChild(el);
}

function addButton(){
let label = prompt("Button text");
let link = prompt("Button link");

let btn = document.createElement("button");
btn.textContent = label;

btn.onclick = function(){
window.location = link;
}

document.getElementById("canvas").appendChild(btn);
}

function addImage(){
let url = prompt("Image URL");

let img = document.createElement("img");
img.src = url;
img.style.maxWidth = "200px";

document.getElementById("canvas").appendChild(img);
}

function exportHTML(){
let html = document.getElementById("canvas").innerHTML;
document.getElementById("output").value =
"<html>\n<body>\n" + html + "\n</body>\n</html>";
}

</script>

</body>
</html>
