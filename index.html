<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:100%;min-height:100vh;overflow-x:hidden;font-family:'Outfit',sans-serif;background:white}
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse-a{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aura-pulse{0%,100%{box-shadow:0 0 20px 6px rgba(124,92,252,0.5),0 0 40px 12px rgba(192,132,252,0.3)}50%{box-shadow:0 0 35px 14px rgba(124,92,252,0.8),0 0 70px 24px rgba(192,132,252,0.5)}}
@keyframes aura-fire{0%,100%{box-shadow:0 0 20px 6px rgba(251,146,60,0.6),0 0 40px 14px rgba(239,68,68,0.4)}50%{box-shadow:0 0 40px 18px rgba(251,146,60,0.9),0 0 80px 30px rgba(239,68,68,0.6)}}
@keyframes aura-ice{0%,100%{box-shadow:0 0 20px 6px rgba(96,165,250,0.5),0 0 40px 12px rgba(34,211,238,0.3)}50%{box-shadow:0 0 35px 14px rgba(96,165,250,0.8),0 0 70px 24px rgba(34,211,238,0.5)}}
@keyframes aura-gold{0%,100%{box-shadow:0 0 20px 6px rgba(250,204,21,0.5),0 0 40px 12px rgba(245,158,11,0.3)}50%{box-shadow:0 0 35px 14px rgba(250,204,21,0.9),0 0 70px 24px rgba(245,158,11,0.6)}}

.float{animation:float 2s infinite ease-in-out}
.pulse{animation:pulse-a 1.5s infinite ease-in-out}
.spin{animation:spin 2s linear infinite}
.aura{animation:aura-pulse 2s infinite ease-in-out}
.aura-fire{animation:aura-fire 1.5s infinite ease-in-out}
.aura-ice{animation:aura-ice 2.5s infinite ease-in-out}
.aura-gold{animation:aura-gold 2s infinite ease-in-out}

.element{position:absolute;cursor:default!important}
.el-btn{padding:0.8em 1.2em;border-radius:9px;background:linear-gradient(135deg,#7c5cfc,#c084fc);color:#fff;font-family:inherit;font-size:0.9em;font-weight:600;cursor:pointer;box-shadow:0 0.25em 0.85em rgba(124,92,252,0.35);display:inline-block;white-space:nowrap;text-align:center;transition:all 0.2s ease}
.el-btn:hover{transform:scale(1.1);box-shadow:0 0.35em 1em rgba(124,92,252,0.5)}
.el-text{font-family:inherit;font-size:1em;color:#111;padding:0.2em;min-width:fit-content;max-width:90vw}

@media (max-width:768px){
  .element{position:relative;left:auto;top:auto;margin:1em auto;display:block;text-align:center}
  .el-btn{width:90%;max-width:300px;margin:0.5em auto;display:block}
  .el-text{font-size:1.2em;margin:0.5em auto;display:block}
  img.element{width:90%;height:auto;left:auto;top:auto;margin:1em auto;display:block}
}
</style>
</head>
<body>

<div class="element el-text aura" contenteditable="true" style="left: 50%; top: 5%; transform: translateX(-50%); font-size: 32px; font-weight:700;">Hello Welcome To My Site!</div>

<img src="https://media.giphy.com/media/26tn33aiTi1jkl6H6/giphy.gif" class="element el-img aura-fire float" style="left:50%; top:50%; transform:translateX(-50%); width:500px; height:200px; max-width:90vw;">

<div class="element el-btn" onclick="window.open('https://www.youtube.com/@Kubaxone')"
     style="left:50%; top:30%; transform:translateX(-50%); width:auto;">Cool!</div>

<div class="element el-text" contenteditable="true" style="left:50%; top:25%; transform:translateX(-50%);">Hello Good Friends This Is A Cool Site</div>

<div class="element el-text" contenteditable="true" style="left:50%; top:28%; transform:translateX(-50%);">Check Out My Other Sites</div>

<div class="element el-text" contenteditable="true" style="left:50%; top:33%; transform:translateX(-50%);">(dont do /fileexplorer2)</div>

<div class="element el-btn" onclick="window.open('https://lol.kubaxones.publicvm.com/htmldesigner')"
     style="left:50%; top:40%; transform:translateX(-50%); width:auto;">HTML Designer (FIXED BUTTON)</div>

<div class="element el-btn spin">Free Movies</div>

<div class="element el-btn" onclick="window.open('https://kubaxone.github.io/Kubaflix-Free-Streaming/')">My Free Movie Streaming</div>

<div class="element el-btn" onclick="window.open('https://lol.kubaxones.publicvm.com/oldindex.html')">Old Home Site</div>

<div class="element el-btn" onclick="window.open('https://lol.kubaxones.publicvm.com/coolaaa')">frist version made</div>

</body>
</html>
