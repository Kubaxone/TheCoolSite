<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lol.kubaxones.publicvm.com</title>
<style>
  /* ----- Global Styles ----- */
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: black;
    color: #fff;
    overflow-x: hidden;
    perspective: 1px; /* parallax perspective */
    height: 100%;
    position: relative;
  }

  a {
    text-decoration: none;
    color: #ff69b4;
    font-weight: bold;
  }
  a:hover { color: #00ffff; }

  /* ----- Parallax Layers ----- */
  .parallax-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  #earth { background-image: url('https://images.unsplash.com/photo-1579969340030-1f6ac6c5b2d6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080'); }
  #atmosphere { background-image: url('https://images.unsplash.com/photo-1581092795360-0c4f4ecf9cf0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080'); }
  #stars { background-image: url('https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1080'); }

  /* ----- Neon Header ----- */
  header {
    text-align: center;
    padding: 50px 20px;
    font-size: 2.5rem;
    font-weight: bold;
    letter-spacing: 2px;
    position: relative;
    z-index: 2;
    animation: pulse 2s infinite;
    text-shadow: 0 0 5px #ff69b4, 0 0 10px #00ffff;
  }

  @keyframes pulse {
    0%,100% { color: #ff69b4; text-shadow: 0 0 10px #ff69b4, 0 0 20px #00ffff; }
    50% { color: #00ffff; text-shadow: 0 0 20px #00ffff,0 0 40px #ff69b4; }
  }

  header p {
    font-size: 1rem;
    font-weight: normal;
    color: #ccc;
  }

  /* ----- Marquee ----- */
  .marquee {
    position: absolute;
    bottom: 60px;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    font-size: 1.2em;
    color: #ff69b4;
    animation: scroll 15s linear infinite;
    z-index: 2;
  }
  @keyframes scroll {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  /* ----- Main Content ----- */
  main {
    padding: 40px 20px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  h2 {
    font-size: 1.8rem;
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  }

  .images-section {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 40px;
  }

  .images-section div {
    width: 200px;
    height: 120px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .subscribe-btn {
    display: inline-block;
    padding: 15px 30px;
    font-size: 1.1rem;
    background: #ff4b2b;
    border-radius: 30px;
    transition: all 0.3s ease;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  .subscribe-btn:hover {
    background: #ff416c;
    transform: scale(1.05);
  }

  /* ----- Floating shapes ----- */
  .shape {
    position: absolute;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    animation: float 12s linear infinite;
    z-index: 1;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-100vh) rotate(360deg); }
  }

  /* ----- Physics box ----- */
  #physicsBox {
    position: absolute;
    width: 60px; height: 60px;
    background: #ff69b4;
    border-radius: 10px;
    top: 100px; left: 100px;
    z-index: 2;
  }

  /* ----- Video corner ----- */
  .video-corner {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 250px;
    height: 140px;
    border: 2px solid #ff69b4;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    z-index: 10;
  }
  .video-corner iframe, .video-corner video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ----- Footer ----- */
  footer {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    text-align: center;
    padding: 20px;
    font-size: 0.9rem;
    position: relative;
    z-index: 2;
  }

  footer a { margin:0 10px; color:#fff; font-weight:bold; transition:0.3s; }
  footer a:hover { color:#ffd700; }
</style>
</head>
<body>

  <!-- Parallax Layers -->
  <div class="parallax-layer" id="earth"></div>
  <div class="parallax-layer" id="atmosphere"></div>
  <div class="parallax-layer" id="stars"></div>

  <header>
    ✨ Welcome to the Mystery Zone ✨
    <p>Exploring GitHub Pages, neon vibes, floating shapes, and physics fun!</p>
  </header>

  <div class="marquee">🚀 Neon vibes, floating shapes, and surprises await! 🌌 Stay tuned! 🚀</div>

  <!-- Floating shapes -->
  <div class="shape" style="left:10%; animation-duration:14s;"></div>
  <div class="shape" style="left:30%; animation-duration:18s;"></div>
  <div class="shape" style="left:50%; animation-duration:12s;"></div>
  <div class="shape" style="left:70%; animation-duration:16s;"></div>
  <div class="shape" style="left:90%; animation-duration:20s;"></div>

  <!-- Physics box -->
  <div id="physicsBox"></div>

  <!-- Video corner -->
  <div class="video-corner">
    <iframe src="https://www.youtube.com/embed/vTfD20dbxhov?autoplay=1&mute=1&loop=1&playlist=PHGlG1xPUrk" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <main>
    <h2>Some Cool Images</h2>
    <div class="images-section">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <a class="subscribe-btn" href="https://www.youtube.com/@YourChannel" target="_blank">
      Like & Subscribe to My Channel
    </a>
  </main>

  <footer>
    <a href="#">Privacy Policy</a> | 
    <a href="#">Terms of Service</a> | 
    <a href="#">Contact</a> | 
    © 2026 Kubaxone
  </footer>

<script>
  // Physics box
  const box = document.getElementById('physicsBox');
  let posX = 100, posY = 100, velX = 3, velY = 2;
  const boxWidth = 60, boxHeight = 60;

  function updateBox() {
    posX += velX; posY += velY;
    if(posX + boxWidth > window.innerWidth || posX < 0) velX *= -1;
    if(posY + boxHeight > window.innerHeight || posY < 0) velY *= -1;
    box.style.left = posX + 'px';
    box.style.top = posY + 'px';
    requestAnimationFrame(updateBox);
  }
  updateBox();

  // Parallax scroll
  window.addEventListener('scroll', () => {
    const scroll = window.scrollY;
    document.getElementById('earth').style.transform = `translateY(${scroll * 0.2}px) scale(1)`;
    document.getElementById('atmosphere').style.transform = `translateY(${scroll * 0.5}px) scale(1.5)`;
    document.getElementById('stars').style.transform = `translateY(${scroll * 0.8}px) scale(2)`;
  });
</script>

</body>
</html>
</body>
</html>
