<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:100%;min-height:100vh;overflow-x:hidden;font-family:'Outfit',sans-serif;background:white}
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse-a{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aura-pulse{0%,100%{box-shadow:0 0 20px 6px rgba(124,92,252,0.5),0 0 40px 12px rgba(192,132,252,0.3)}50%{box-shadow:0 0 35px 14px rgba(124,92,252,0.8),0 0 70px 24px rgba(192,132,252,0.5)}}
@keyframes aura-fire{0%,100%{box-shadow:0 0 20px 6px rgba(251,146,60,0.6),0 0 40px 14px rgba(239,68,68,0.4)}50%{box-shadow:0 0 40px 18px rgba(251,146,60,0.9),0 0 80px 30px rgba(239,68,68,0.6)}}
@keyframes aura-ice{0%,100%{box-shadow:0 0 20px 6px rgba(96,165,250,0.5),0 0 40px 12px rgba(34,211,238,0.3)}50%{box-shadow:0 0 35px 14px rgba(96,165,250,0.8),0 0 70px 24px rgba(34,211,238,0.5)}}
@keyframes aura-gold{0%,100%{box-shadow:0 0 20px 6px rgba(250,204,21,0.5),0 0 40px 12px rgba(245,158,11,0.3)}50%{box-shadow:0 0 35px 14px rgba(250,204,21,0.9),0 0 70px 24px rgba(245,158,11,0.6)}}

.float{animation:float 2s infinite ease-in-out}
.pulse{animation:pulse-a 1.5s infinite ease-in-out}
.spin{animation:spin 2s linear infinite}
.aura{animation:aura-pulse 2s infinite ease-in-out}
.aura-fire{animation:aura-fire 1.5s infinite ease-in-out}
.aura-ice{animation:aura-ice 2.5s infinite ease-in-out}
.aura-gold{animation:aura-gold 2s infinite ease-in-out}

.element{position:absolute;cursor:default!important}
.el-btn{padding:10px 22px;border-radius:9px;background:linear-gradient(135deg,#7c5cfc,#c084fc);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(124,92,252,0.35);display:inline-block;white-space:nowrap;transition:all 0.2s ease}
.el-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(124,92,252,0.5)}
.el-text{font-family:inherit;font-size:16px;color:#111;padding:4px;min-width:fit-content;max-width:90vw}

/* Responsive scaling without killing absolute positioning */
@media (max-width:768px){
  .element{
    transform: scale(0.7); /* shrink elements proportionally */
  }
  img.element{
    width: 90% !important;
    height: auto !important;
  }
  .el-btn{
    font-size:12px;
    padding:8px 16px;
  }
  .el-text{
    font-size:14px;
  }
}
</style>
</head>
